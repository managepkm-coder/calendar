<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9e7ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="근무표">
<title>근무표</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<main class="card">
  <header>
    <button class="icon" id="btnSettings" aria-label="설정">⚙</button>
    <div class="nav">
      <button class="arrow" id="prev" aria-label="이전 달">‹</button>
      <h1 id="ym">—</h1>
      <button class="arrow" id="next" aria-label="다음 달">›</button>
    </div>
    <button class="icon" id="today" aria-label="오늘로">⟳</button>
    <div id="sub"></div>
  </header>

  <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
  <div id="grid"></div>
</main>

<dialog id="settings">
  <h2>내 근무 맞추기</h2>
  <p>근무 패턴 · <b id="patternText"></b></p>
  <button class="txt" id="btnPattern">근무 패턴 바꾸기</button>
  <p class="gap">오늘은 차례의 몇 번째 날인가요? 하나만 고르면 나머지 날짜가 모두 맞춰집니다.</p>
  <div class="row" id="offsetBtns"></div>
  <button class="txt" id="resetAll">직접 지정한 날짜 모두 지우기</button>
  <button class="txt" onclick="this.closest('dialog').close()">닫기</button>
</dialog>

<dialog id="pattern">
  <h2>근무 패턴 만들기</h2>
  <p>되풀이되는 차례를 하루씩 골라 쌓습니다. 이틀 이상이면 거기서 끊어 저장할 수 있습니다.</p>
  <p class="gap"><b id="patternSoFar"></b></p>
  <h2 id="patternStep"></h2>
  <div class="row" id="patternBtns"></div>
  <button class="txt" id="patternSave"></button>
  <button class="txt" id="patternUndo">한 칸 지우기</button>
  <button class="txt" id="patternDefault">기본 4일 주기 (주 · 야 · 비 · 휴)</button>
  <button class="txt" onclick="this.closest('dialog').close()">닫기</button>
</dialog>

<dialog id="daySheet">
  <h2 id="dayTitle"></h2>
  <p>이 날의 근무를 직접 바꿉니다. (교대·연차용)</p>
  <div class="row" id="dayBtns"></div>
  <button class="txt" data-set="clear">이 날 지정 해제 (주기대로)</button>
  <button class="txt" onclick="this.closest('dialog').close()">닫기</button>
</dialog>

<script src="./holidays.js"></script>
<script src="./app.js"></script>
</body>
</html>
